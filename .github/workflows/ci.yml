name: CI


on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'


      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


      - name: Upload coverage report
        if: always()   
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7   

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci


      - name: Check syntax
        run: |
          echo "Checking JavaScript syntax..."
          find src -name "*.js" -exec node --check {} \;
          echo "All files passed syntax check."
